name: release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        run: |
          curl -L -o zig.tar.xz https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"

      - name: Build all targets
        run: |
          zig build -Doptimize=ReleaseSafe -Dtarget=x86_64-linux-musl  --prefix out/linux-x86_64
          zig build -Doptimize=ReleaseSafe -Dtarget=aarch64-linux-musl --prefix out/linux-aarch64
          zig build -Doptimize=ReleaseSafe -Dtarget=x86_64-macos      --prefix out/macos-x86_64
          zig build -Doptimize=ReleaseSafe -Dtarget=aarch64-macos     --prefix out/macos-aarch64

      - name: Rename binaries
        run: |
          mv out/linux-x86_64/bin/weg  weg-linux-x86_64
          mv out/linux-aarch64/bin/weg weg-linux-aarch64
          mv out/macos-x86_64/bin/weg  weg-macos-x86_64
          mv out/macos-aarch64/bin/weg weg-macos-aarch64

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            weg-linux-x86_64
            weg-linux-aarch64
            weg-macos-x86_64
            weg-macos-aarch64
